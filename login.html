<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ZIKKA - Login</title>

  <link rel="icon" type="image/png" href="imagens/ChatGPT Image 28 de jul. de 2026, 15_02_54.png" />
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <link rel="stylesheet" href="login.css" />
</head>
<body>

  <header class="topo-site">
    <div class="menu-container">
      <a href="inicio.html" class="logo">ZIKKA</a>
      <div class="menu-iconos">
        <button id="theme-toggle" class="theme-toggle-btn" type="button" aria-label="Alternar Tema">
          <span id="theme-icon">🌙</span>
        </button>
      </div>
    </div>
  </header>

  <div class="login-page-wrapper">
    
    <section class="branding-side">
      <div class="branding-content">
        <div class="branding-logo-wrapper">
        </div>
        <h1 class="brand-title">ZIKKA</h1>
        <p class="brand-subtitle">
          Acesse sua conta para conferir seus pedidos, lançamentos e ofertas exclusivas.
        </p>
      </div>
    </section>

    <section class="form-side">
      <div class="login-card">
        <header class="login-header">
          <h2>Bem-Vindo de Volta</h2>
          <p>Por favor, faça login para continuar</p>
        </header>

        <div id="errorAlert" class="alert alert-error"></div>

        <form id="loginForm" class="login-form">
          <div class="input-field">
            <label for="email">E-mail</label>
            <div class="input-wrapper">
              <i class="fa-regular fa-envelope input-icon"></i>
              <input type="email" id="email" placeholder="seuemail@exemplo.com" required />
            </div>
          </div>

          <div class="input-field">
            <label for="password">Senha</label>
            <div class="input-wrapper">
              <i class="fa-solid fa-lock input-icon"></i>
              <input type="password" id="password" placeholder="••••••••" required />
              <button type="button" id="togglePassword" class="btn-toggle-pass" aria-label="Mostrar senha">
                <i id="eyeIcon" class="fa-regular fa-eye"></i>
              </button>
            </div>
            <span class="input-hint">A senha deve conter pelo menos 6 caracteres.</span>
          </div>

          <div class="form-options">
            <label class="remember-me">
              <input type="checkbox" id="remember" /> Lembrar de mim
            </label>
            <a href="esqueci-senha.html" class="forgot-pass">Esqueceu a senha?</a>
          </div>

          <button type="submit" class="btn-submit">
            <span>Entrar na ZIKKA</span>
            <i class="fa-solid fa-arrow-right"></i>
          </button>
        </form> 

        <footer class="login-footer">
          <p>Ainda não tem conta? <a href="cadastro.html" id="btnRegister">Cadastre-se</a></p>
        </footer>
      </div>
    </section>

  </div>

  <script src="login.js"></script>
</body>
</html>
