<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZIKKA - Carrinho</title>


    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='grad' x1='0%' y1='0%' x2='100%' y2='100%'><stop offset='0%' style='stop-color:%233b82f6;' /><stop offset='100%' style='stop-color:%231d4ed8;' /></linearGradient></defs><rect width='100' height='100' rx='28' fill='%230a0a12'/><path d='M28 28 H72 L38 72 H72' fill='none' stroke='url(%23grad)' stroke-width='14' stroke-linecap='round' stroke-linejoin='round'/></svg>"> 
    
    <link rel="stylesheet" href="inicio.css">
</head>
<body>

<header class="topo-site">
    <nav class="menu-container">
        
        <a href="inicio.html" class="logo">
            ZIKKA
        </a>

        <ul class="menu-links">
            <li><a href="inicio.html">Início</a></li>
            <li><a href="contato.html">Contato</a></li>
        </ul>

        <div class="menu-iconos">
            <button id="theme-toggle" class="theme-toggle-btn" aria-label="Alternar Tema">
                <span id="theme-icon">🌙</span>
                <span id="theme-text">Escuro</span>
            </button>

            <a href="carrinho.html" class="icon-btn cart-btn">
                🛒 <span class="cart-badge" id="contador-carrinho">0</span>
            </a>
        </div>
    </nav>
</header>

<main class="carrinho-container">
    <h1>Seu Carrinho</h1>

    <div class="carrinho-wrapper">
        <div id="lista-carrinho" class="lista-carrinho"></div>

        <div class="resumo-carrinho">
            <h3>Resumo do Pedido</h3>
            <div class="resumo-linha">
                <span>Subtotal:</span>
                <span id="subtotal">R$ 0,00</span>
            </div>
            <div class="resumo-linha">
                <span>Frete:</span>
                <span class="frete-gratis">Grátis</span>
            </div>
            <hr>
            <div class="resumo-linha total">
                <span>Total:</span>
                <span id="total-pedido">R$ 0,00</span>
            </div>
            <button class="btn-finalizar" onclick="finalizarCompra()">Finalizar Compra</button>
        </div>
    </div>
</main>


<script src="carrinho.js"></script>

</body>
</html>
